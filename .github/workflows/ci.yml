name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node and pnpm
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Run quality gate
        shell: pwsh
        run: |
          node --version
          pnpm --version
          $historyTemp = node -p "require('node:os').tmpdir()"
          if ($IsWindows) {
            Get-Volume -FilePath $historyTemp | Format-List DriveLetter, FileSystem
          } else {
            findmnt -n -o FSTYPE -T $historyTemp
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          pnpm check:isolated
